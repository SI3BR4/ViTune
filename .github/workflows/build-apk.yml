name: APK com importacao Spotify
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar componentes Android
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;4.1.2'
      - name: Configurar revisao 37.2 do SDK
        run: |
          find app core compose -name build.gradle.kts -exec sed -i 's/compileSdk = 37/compileSdk { version = release(37) { minorApiLevel = 2 } }/g' {} +
      - name: Gerar APK de teste
        shell: bash
        run: |
          set -o pipefail
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-apk.log
      - name: Habilitar aceleracao do emulador
        run: |
          sudo chmod 666 /dev/kvm
      - name: Testar navegacao no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 320
            java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:connectedDebugAndroidTest --no-daemon --stacktrace
            adb pull /sdcard/Android/data/app.vitune.android.debug/files/navigation-regression navigation-screenshots
      - name: Guardar verificacao visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navegacao-testes-e-imagens
          path: |
            navigation-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ViTune-Navegacao-Corrigida-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-compilacao
          path: build-apk.log
          if-no-files-found: ignore
