name: Verificar SDK Android
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Listar plataformas disponiveis
        run: sdkmanager --list --channel=3 | tee sdk-packages.log
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-packages
          path: sdk-packages.log
