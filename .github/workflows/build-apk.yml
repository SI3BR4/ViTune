name: APK com menu de icones
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar componentes Android
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;4.1.2'
      - name: Configurar revisao 37.2 do SDK
        run: |
          find app core compose -name build.gradle.kts -exec sed -i 's/compileSdk = 37/compileSdk { version = release(37) { minorApiLevel = 2 } }/g' {} +
      - name: Gerar APK de teste
        shell: bash
        run: |
          set -o pipefail
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-apk.log
      - uses: actions/upload-artifact@v4
        with:
          name: ViTune-menu-icones-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-compilacao
          path: build-apk.log
          if-no-files-found: ignore
